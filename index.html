<head>
<meta charset="UTF-8">
<title>Foodpicker</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Prompt', sans-serif;
  background-color: #fff8ec;
}

.navbar {
  background-color: #2f4f3a;
  color: white;
  padding: 15px 30px;
  overflow: hidden;
}

.logo {
  float: left;
  font-size: 20px;
  color: #ffb84d;
}

.info {
  float: right;
  font-size: 13px;
  margin-top: 5px;
}

h2 {
  text-align: center;
  color: #2f4f3a;
  margin-top: 40px;
}

.box {
  width: 320px;
  margin: 20px auto;
}

.card {
  background-color: white;
  border: 2px solid #2f4f3a;
  border-radius: 20px;
  padding: 25px;
  text-align: center;
}

.card img {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  border: 4px solid #ffb84d;
}

#name {
  color: #2f4f3a;
  margin: 15px 0 5px 0;
}

#desc {
  font-size: 13px;
  color: gray;
}

#price {
  color: white;
  background-color: #2f4f3a;
  font-size: 13px;
  padding: 5px 15px;
  border-radius: 5px;
}

/* ปุ่ม */
.btn {
  width: 100%;
  margin-top: 20px;
  padding: 12px;
  background-color: #ffb84d;
  color: #2f4f3a;
  border: 2px solid #2f4f3a;
  border-radius: 10px;
  font-family: 'Prompt', sans-serif;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 4px 4px 0px #2f4f3a;
}

.btn:hover {
  background-color: #ffa31a;
}

.btn:active {
  box-shadow: none;
  margin-left: 4px;
}
</style>
</head>
